<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyBuddy</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f5;font-family:Arial,Helvetica,sans-serif;color:#1d2421;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f5;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e2e6e4;max-width:480px;">
          <tr>
            <td style="background:#0A1916;padding:20px 28px;">
              <span style="color:#ffffff;font-size:18px;font-weight:bold;">Study<span style="color:#00895A;">Buddy</span></span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;background:#f8f9fa;border-top:1px solid #e2e6e4;color:#8a938e;font-size:12px;">
              This is an automated message from StudyBuddy. Please do not reply.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
